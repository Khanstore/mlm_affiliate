<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Coin / money bag body -->
  <circle cx="32" cy="38" r="20" fill="#2e7d32"/>
  <!-- Coin shine -->
  <circle cx="32" cy="38" r="17" fill="#43a047"/>
  <!-- Dollar sign -->
  <text x="32" y="44" text-anchor="middle" font-family="Arial,sans-serif"
        font-size="20" font-weight="bold" fill="#ffffff">$</text>
  <!-- Network dots -->
  <circle cx="12" cy="14" r="5" fill="#1a3c5e"/>
  <circle cx="32" cy="6"  r="5" fill="#1a3c5e"/>
  <circle cx="52" cy="14" r="5" fill="#1a3c5e"/>
  <!-- Network lines -->
  <line x1="17" y1="14" x2="27" y2="8"  stroke="#1a3c5e" stroke-width="2"/>
  <line x1="37" y1="8"  x2="47" y2="14" stroke="#1a3c5e" stroke-width="2"/>
  <line x1="14" y1="19" x2="26" y2="30" stroke="#1a3c5e" stroke-width="2"/>
  <line x1="50" y1="19" x2="38" y2="30" stroke="#1a3c5e" stroke-width="2"/>
</svg>
